<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Preference Elicitation Study — Movie Recommender</title>
<style>
  :root{
    --ink:#EDE7DA;
    --ink-dim:#B9B2A2;
    --bg:#16171B;
    --panel:#1E2026;
    --panel-2:#25272E;
    --line:#33353C;
    --amber:#C9974C;
    --amber-dim:#8f6d38;
    --teal:#5C9E93;
    --red:#B0524A;
    --radius:4px;
    --serif: Georgia, 'Iowan Old Style', 'Times New Roman', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);}
  body{min-height:100vh;}
  #app{max-width:760px;margin:0 auto;padding:56px 24px 96px;}
  h1,h2,h3{font-family:var(--serif);font-weight:400;color:var(--ink);margin:0 0 .4em;}
  h1{font-size:2.6rem;line-height:1.1;letter-spacing:.2px;}
  h2{font-size:1.5rem;margin-top:0;}
  h3{font-size:1.1rem;color:var(--amber);}
  p{line-height:1.65;color:var(--ink-dim);font-size:1rem;max-width:64ch;}
  .lede{font-size:1.15rem;color:var(--ink);}
  .eyebrow{color:var(--teal);font-size:.85rem;margin-bottom:14px;font-family:var(--sans);}
  .rule{border:0;border-top:1px solid var(--line);margin:36px 0;}
  .actions{display:flex;gap:14px;margin-top:28px;flex-wrap:wrap;}
  button, .btn{
    font-family:var(--sans);font-size:.98rem;border-radius:var(--radius);cursor:pointer;
    padding:13px 22px;border:1px solid transparent;transition:transform .12s ease, background .15s ease;
    text-decoration:none;display:inline-block;
  }
  .btn-primary{background:var(--amber);color:#1B1B1F;font-weight:600;}
  .btn-primary:hover{background:#d9a95c;transform:translateY(-1px);}
  .btn-ghost{background:transparent;color:var(--ink);border-color:var(--line);}
  .btn-ghost:hover{border-color:var(--ink-dim);}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:22px 24px;margin:14px 0;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media(max-width:600px){.grid2{grid-template-columns:1fr;}}
  .movie-card{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:20px;cursor:pointer;transition:border-color .15s, transform .1s;}
  .movie-card:hover{border-color:var(--amber);transform:translateY(-2px);}
  .movie-title{font-family:var(--serif);font-size:1.2rem;color:var(--ink);margin-bottom:6px;}
  .movie-meta{font-size:.82rem;color:var(--ink-dim);}
  .genre-pill{display:inline-block;background:#2c2e35;color:var(--teal);font-size:.72rem;padding:2px 8px;border-radius:100px;margin:2px 4px 0 0;}
  .progress-wrap{display:flex;align-items:center;gap:10px;margin-bottom:28px;}
  .progress-bar{flex:1;height:4px;background:var(--line);border-radius:2px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--amber);transition:width .3s ease;}
  .progress-label{font-size:.8rem;color:var(--ink-dim);white-space:nowrap;}
  .rank-list{list-style:none;padding:0;margin:0;}
  .rank-item{display:flex;align-items:center;gap:14px;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin-bottom:8px;}
  .rank-pos{font-family:var(--serif);color:var(--amber);font-size:1.1rem;width:24px;text-align:center;}
  .rank-info{flex:1;}
  .rank-title{font-size:.98rem;color:var(--ink);}
  .rank-meta{font-size:.76rem;color:var(--ink-dim);}
  .rank-controls{display:flex;flex-direction:column;gap:2px;}
  .rank-controls button{padding:2px 8px;font-size:.75rem;background:var(--panel);border:1px solid var(--line);color:var(--ink-dim);}
  .rank-controls button:hover{color:var(--amber);border-color:var(--amber);}
  .rank-controls button:disabled{opacity:.25;cursor:default;}
  label.q{display:block;margin-bottom:22px;}
  label.q .qtext{display:block;margin-bottom:8px;color:var(--ink);font-size:.98rem;}
  .likert{display:flex;gap:8px;}
  .likert label{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.72rem;color:var(--ink-dim);cursor:pointer;}
  .likert input{accent-color:var(--amber);width:18px;height:18px;}
  select, input[type=text]{background:var(--panel-2);border:1px solid var(--line);color:var(--ink);padding:9px 12px;border-radius:4px;font-family:var(--sans);width:100%;font-size:.95rem;}
  .stat-row{display:flex;gap:28px;margin:18px 0;flex-wrap:wrap;}
  .stat{min-width:120px;}
  .stat-num{font-family:var(--serif);font-size:2rem;color:var(--amber);}
  .stat-label{font-size:.78rem;color:var(--ink-dim);text-transform:none;}
  .top-list{list-style:none;padding:0;counter-reset:rank;}
  .top-list li{counter-increment:rank;position:relative;padding:10px 0 10px 34px;border-bottom:1px solid var(--line);}
  .top-list li::before{content:counter(rank);position:absolute;left:0;top:10px;color:var(--amber);font-family:var(--serif);}
  footer{margin-top:60px;font-size:.78rem;color:#5c5e66;}
  .hidden{display:none !important;}
  .condition-tag{display:inline-block;background:var(--panel-2);color:var(--teal);border:1px solid var(--line);padding:4px 10px;border-radius:100px;font-size:.75rem;margin-bottom:16px;}
</style>
</head>

const FEATURE_NAMES = DATA.feature_names;
const ALL_MOVIES = DATA.movies; // each: {title, genres, year, director, x}

// reserve the last 12 movies exclusively for the held-out evaluation block
const HOLDOUT_POOL = ALL_MOVIES.slice(ALL_MOVIES.length - 12);
const ELICIT_POOL = ALL_MOVIES.slice(0, ALL_MOVIES.length - 12);

const D = FEATURE_NAMES.length;

// ---------- Plackett-Luce MLE (mirrors preference_model.py) ----------
function fitPreferenceVector(rankings, l2, lr, nIter){
  l2 = l2 ?? 0.05; lr = lr ?? 0.05; nIter = nIter ?? 400;
  let w = new Array(D).fill(0);
  for(let it=0; it<nIter; it++){
    const grad = new Array(D).fill(0);
    for(const ranking of rankings){
      const utils = ranking.map(m => dot(w, m.x));
      for(let k=0;k<ranking.length;k++){
        const remaining = utils.slice(k);
        const m = Math.max(...remaining);
        const exps = remaining.map(u => Math.exp(u-m));
        const denom = exps.reduce((a,b)=>a+b,0);
        const weights = exps.map(e => e/denom);
        for(let j=k;j<ranking.length;j++){
          const wgt = weights[j-k];
          for(let d=0; d<D; d++) grad[d] += wgt*ranking[j].x[d];
        }
        for(let d=0; d<D; d++) grad[d] -= ranking[k].x[d];
      }
    }
    for(let d=0; d<D; d++){
      grad[d] += l2*w[d];
      w[d] -= lr*grad[d];
    }
  }
  return w;
}
function dot(a,b){let s=0;for(let i=0;i<a.length;i++)s+=a[i]*b[i];return s;}

// ---------- sampling helpers ----------
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function sampleWithoutReplacement(pool, n, excludeSet){
  const avail = pool.filter(m => !excludeSet.has(m.title));
  return shuffle(avail).slice(0,n);
}

function el(tag, attrs, children){
  const e = document.createElement(tag);
  attrs = attrs || {};
  for(const k in attrs){
    if(attrs[k] === null || attrs[k] === undefined) continue;
    if(k==='html'){ e.innerHTML = attrs[k]; }
    else if(k.startsWith('on')){ e.addEventListener(k.slice(2), attrs[k]); }
    else e.setAttribute(k, attrs[k]);
  }
  (children||[]).forEach(c => { if(c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
  return e;
}

  const card = el('div',{class:'card'});
  card.appendChild(el('p',{},['Participation is voluntary. You may stop at any point with no penalty. Your responses (movie choices, timing, and brief follow-up questions) are recorded without directly identifying information, and used only to compare the two study conditions.']));
  card.appendChild(el('p',{},['No video or audio is shown — only movie titles and basic metadata (genre, year, director, cast). The study takes about 10 minutes.']));
  app.appendChild(card);
  const actions = el('div',{class:'actions'});
  actions.appendChild(el('button',{class:'btn btn-ghost', onclick:()=>{state.screen='landing';render();}},['Back']));
  actions.appendChild(el('button',{class:'btn btn-primary', onclick:()=>{
    state.participantId = uid();
    state.screen='intake'; render();
  }},['I agree — continue']));
  app.appendChild(actions);
}

// ---------------- INTAKE ----------------
function renderIntake(app){
  app.appendChild(el('div',{class:'eyebrow'},['A couple of quick questions']));
  app.appendChild(el('h2',{},['About you']));
  const form = el('div',{class:'card'});

  const q1 = el('label',{class:'q'});
  q1.appendChild(el('span',{class:'qtext'},['How often do you watch movies?']));
  const sel = el('select',{id:'freq'});
  ['Rarely (a few times a year)','Occasionally (monthly)','Frequently (weekly or more)'].forEach((t,i)=>{
    sel.appendChild(el('option',{value:['light','moderate','heavy'][i]},[t]));
  });
  q1.appendChild(sel);
  form.appendChild(q1);

  const q2 = el('label',{class:'q'});
  q2.appendChild(el('span',{class:'qtext'},['Age range']));
  const sel2 = el('select',{id:'age'});
  ['18–24','25–34','35–44','45–54','55+'].forEach(t=> sel2.appendChild(el('option',{value:t},[t])));
  q2.appendChild(sel2);
  form.appendChild(q2);

  app.appendChild(form);
  const actions = el('div',{class:'actions'});
  actions.appendChild(el('button',{class:'btn btn-primary', onclick:()=>{
    state.intake.frequency = document.getElementById('freq').value;
    state.intake.age = document.getElementById('age').value;
    assignCondition();
    state.studyStart = performance.now();
    state.trialStart = performance.now();
    state.screen = state.condition;
    render();
  }},['Continue']));
  app.appendChild(actions);
}

function assignCondition(){
  // stratified-random by watching frequency, using a simple hash-balanced coin flip
  state.condition = Math.random() < 0.5 ? 'pairwise' : 'ranking';
  if(state.condition === 'pairwise') nextPairwiseTrial();
  else nextRankingRound();
}

// ---------------- DESIGN 1: PAIRWISE ----------------
function nextPairwiseTrial(){
  const pair = sampleWithoutReplacement(ELICIT_POOL, 2, state.usedTitles);
  state.currentPairwise = pair;
}

function movieCard(m, onClick){
  const c = el('div',{class:'movie-card', onclick: onClick});
  c.appendChild(el('div',{class:'movie-title'},[m.title]));
  c.appendChild(el('div',{class:'movie-meta'},[m.director + ' · ' + m.year]));
  const pills = el('div',{},[]);
  m.genres.slice(0,3).forEach(g => pills.appendChild(el('span',{class:'genre-pill'},[g])));
  c.appendChild(pills);
  return c;
}

function progressBar(current, total, label){
  const wrap = el('div',{class:'progress-wrap'});
  const bar = el('div',{class:'progress-bar'});
  bar.appendChild(el('div',{class:'progress-fill', style:`width:${Math.round(100*current/total)}%`}));
  wrap.appendChild(bar);
  wrap.appendChild(el('div',{class:'progress-label'},[label || `${current} / ${total}`]));
  return wrap;
}

function renderPairwise(app){
  app.appendChild(el('div',{class:'condition-tag'},['Pick the one you\u2019d rather watch']));
  app.appendChild(progressBar(state.pairwiseTrials.length, PAIRWISE_N_TRIALS));
  const [a,b] = state.currentPairwise;
  const grid = el('div',{class:'grid2'});
  grid.appendChild(movieCard(a, () => choosePairwise(a,b)));
  grid.appendChild(movieCard(b, () => choosePairwise(b,a)));
  app.appendChild(grid);
}

function choosePairwise(chosen, other){
  const ms = performance.now() - state.trialStart;
  state.pairwiseTrials.push({chosen, other, ms});
  state.usedTitles.add(chosen.title); state.usedTitles.add(other.title);
  state.trialStart = performance.now();
  if(state.pairwiseTrials.length >= PAIRWISE_N_TRIALS){
    finishElicitation();
  } else {
    nextPairwiseTrial();
    render();
  }
}

// ---------------- DESIGN 2: RANKING ----------------
function nextRankingRound(){
  const set = sampleWithoutReplacement(ELICIT_POOL, RANKING_ROUND_SIZE, state.usedTitles);
  state.currentRankingRound = set;
  state.currentRankingOrder = shuffle(set);
}

function renderRanking(app){
  app.appendChild(el('div',{class:'condition-tag'},['Drag with the arrows: most preferred at the top']));
  app.appendChild(progressBar(state.rankingRounds.length, RANKING_N_ROUNDS, `Round ${state.rankingRounds.length+1} / ${RANKING_N_ROUNDS}`));
  const list = el('ul',{class:'rank-list'});
  state.currentRankingOrder.forEach((m, idx) => {
    const li = el('li',{class:'rank-item'});
    li.appendChild(el('div',{class:'rank-pos'},[String(idx+1)]));
    const info = el('div',{class:'rank-info'});
    info.appendChild(el('div',{class:'rank-title'},[m.title]));
    info.appendChild(el('div',{class:'rank-meta'},[m.director + ' · ' + m.year + ' · ' + m.genres.slice(0,2).join(', ')]));
    li.appendChild(info);
    const ctrl = el('div',{class:'rank-controls'});
    const up = el('button',{disabled: idx===0 ? 'true': null, onclick:()=>{moveRank(idx,-1);}},['\u2191']);
    const down = el('button',{disabled: idx===state.currentRankingOrder.length-1 ? 'true': null, onclick:()=>{moveRank(idx,1);}},['\u2193']);
    ctrl.appendChild(up); ctrl.appendChild(down);
    li.appendChild(ctrl);
    list.appendChild(li);
  });
  app.appendChild(list);
  const actions = el('div',{class:'actions'});
  actions.appendChild(el('button',{class:'btn btn-primary', onclick: submitRanking},['Submit this ranking']));
  app.appendChild(actions);
}

function moveRank(idx, dir){
  const arr = state.currentRankingOrder;
  const j = idx+dir;
  if(j<0 || j>=arr.length) return;
  [arr[idx],arr[j]] = [arr[j],arr[idx]];
  render();
}

function submitRanking(){
  const ms = performance.now() - state.trialStart;
  state.rankingRounds.push({order: state.currentRankingOrder, ms});
  state.currentRankingOrder.forEach(m => state.usedTitles.add(m.title));
  state.trialStart = performance.now();
  if(state.rankingRounds.length >= RANKING_N_ROUNDS){
    finishElicitation();
  } else {
    nextRankingRound();
    render();
  }
}

// ---------------- ELICITATION -> HELD-OUT ----------------
function finishElicitation(){
  state.elicitTimeMs = performance.now() - state.studyStart;
  // build ranking-format training data for the model (works for either condition)
  let rankings = [];
  if(state.condition === 'pairwise'){
    rankings = state.pairwiseTrials.map(t => [t.chosen, t.other]);
  } else {
    rankings = state.rankingRounds.map(r => r.order);
  }
  state.fittedW = fitPreferenceVector(rankings, 0.05, 0.05, 400);

  // build held-out pairwise trials from the reserved pool
  const shuffledHoldout = shuffle(HOLDOUT_POOL);
  const pairs = [];
  for(let i=0;i<HELDOUT_N_TRIALS;i++){
    const a = shuffledHoldout[(2*i) % shuffledHoldout.length];
    const b = shuffledHoldout[(2*i+1) % shuffledHoldout.length];
    pairs.push([a,b]);
  }
  state.heldoutTrials = pairs;
  state.heldoutIndex = 0;
  state.currentHeldout = pairs[0];
  state.trialStart = performance.now();
  state.heldoutResults = [];
  state.screen = 'heldout';
  render();
}

function renderHeldout(app){
  app.appendChild(el('div',{class:'condition-tag'},['One more short block — same for everyone']));
  app.appendChild(progressBar(state.heldoutIndex, HELDOUT_N_TRIALS, `${state.heldoutIndex} / ${HELDOUT_N_TRIALS}`));
  const [a,b] = state.currentHeldout;
  const grid = el('div',{class:'grid2'});
  grid.appendChild(movieCard(a, () => chooseHeldout(a,b)));
  grid.appendChild(movieCard(b, () => chooseHeldout(b,a)));
  app.appendChild(grid);
}

function chooseHeldout(chosen, other){
  const predictedUtilChosen = dot(state.fittedW, chosen.x);
  const predictedUtilOther = dot(state.fittedW, other.x);
  const modelAgrees = predictedUtilChosen > predictedUtilOther;
  state.heldoutResults.push(modelAgrees);
  state.heldoutIndex++;
  if(state.heldoutIndex >= HELDOUT_N_TRIALS){
    state.heldoutAccuracy = state.heldoutResults.filter(Boolean).length / state.heldoutResults.length;
    state.screen = 'questionnaire';
    render();
  } else {
    state.currentHeldout = state.heldoutTrials[state.heldoutIndex];
    render();
  }
}

// ---------------- QUESTIONNAIRE ----------------
function likertRow(name, question){
  const wrap = el('label',{class:'q'});
  wrap.appendChild(el('span',{class:'qtext'},[question]));
  const row = el('div',{class:'likert'});
  const labels = ['Not at all','Slightly','Somewhat','Mostly','Very much'];
  for(let i=1;i<=5;i++){
    const lab = el('label',{});
    lab.appendChild(el('input',{type:'radio', name, value:String(i)}));
    lab.appendChild(document.createTextNode(String(i)));
    row.appendChild(lab);
  }
  wrap.appendChild(row);
  const capt = el('div',{style:'display:flex;justify-content:space-between;max-width:200px;margin-top:4px;'});
  capt.appendChild(el('span',{style:'font-size:.68rem;color:var(--ink-dim)'},[labels[0]]));
  capt.appendChild(el('span',{style:'font-size:.68rem;color:var(--ink-dim)'},[labels[4]]));
  wrap.appendChild(capt);
  return wrap;
}

function renderQuestionnaire(app){
  app.appendChild(el('div',{class:'eyebrow'},['Last step']));
  app.appendChild(el('h2',{},['About the experience']));
  const form = el('div',{class:'card'});
  form.appendChild(likertRow('ease','How easy was it to express your preferences?'));
  form.appendChild(likertRow('effort','How much mental effort did the task require?'));
  form.appendChild(likertRow('satisfaction','How satisfied are you with this way of expressing preferences?'));
  app.appendChild(form);
  const actions = el('div',{class:'actions'});
  actions.appendChild(el('button',{class:'btn btn-primary', onclick: () => {
    ['ease','effort','satisfaction'].forEach(name=>{
      const picked = form.querySelector(`input[name="${name}"]:checked`);
      state.questionnaire[name] = picked ? Number(picked.value) : null;
    });
    finalizeAndStore();
  }},['See my recommendations']));
  app.appendChild(actions);
}

// ---------------- DEBRIEF ----------------
function finalizeAndStore(){
  const seen = state.usedTitles;
  const scored = ALL_MOVIES
    .filter(m => !seen.has(m.title))
    .map(m => ({m, score: dot(state.fittedW, m.x)}))
    .sort((a,b)=> b.score - a.score)
    .slice(0,5)
    .map(s => s.m);
  state.topRecommendations = scored;

  const record = {
    participantId: state.participantId,
    condition: state.condition,
    intake: state.intake,
    pairwiseTrials: state.pairwiseTrials.map(t => ({chosen:t.chosen.title, other:t.other.title, ms:t.ms})),
    rankingRounds: state.rankingRounds.map(r => ({order: r.order.map(m=>m.title), ms:r.ms})),
    elicitTimeMs: state.elicitTimeMs,
    heldoutAccuracy: state.heldoutAccuracy,
    questionnaire: state.questionnaire,
    fittedW: state.fittedW,
    timestamp: new Date().toISOString(),
  };
  if(window.storage){
    window.storage.set('responses:' + state.participantId, JSON.stringify(record), true).catch(()=>{});
  }
  state.screen = 'debrief';
  render();
}

function renderDebrief(app){
  app.appendChild(el('div',{class:'eyebrow'},['Thank you']));
  app.appendChild(el('h2',{},['Your personalized picks']));
  app.appendChild(el('p',{},['Based on your answers, here is what the fitted model would recommend from the remaining catalogue:']));
  const list = el('ul',{class:'top-list'});
  state.topRecommendations.forEach(m => {
    list.appendChild(el('li',{},[`${m.title} — ${m.director}, ${m.year}`]));
  });
  app.appendChild(list);

  app.appendChild(el('hr',{class:'rule'}));
  app.appendChild(el('h3',{},['Session summary']));
  const stats = el('div',{class:'stat-row'});
  const addStat = (num,label) => {
    const s = el('div',{class:'stat'});
    s.appendChild(el('div',{class:'stat-num'},[num]));
    s.appendChild(el('div',{class:'stat-label'},[label]));
    stats.appendChild(s);
  };
  addStat(state.condition === 'pairwise' ? 'Pairwise' : 'Ranking', 'Condition assigned');
  addStat((state.elicitTimeMs/1000).toFixed(0)+'s', 'Elicitation time');
  addStat(Math.round(state.heldoutAccuracy*100)+'%', 'Held-out prediction accuracy');
  app.appendChild(stats);
  app.appendChild(el('p',{},['This record has been saved anonymously for the study. Thank you for taking part.']));
  app.appendChild(footerEl());
}

function footerEl(){
  return el('footer',{},['Preference Elicitation Study — Human-Centric AI, Project 4']);
}

render();
</script>
